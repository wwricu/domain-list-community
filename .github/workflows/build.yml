name: Build rules.dat
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions: write-all
    defaults:
      run:
        working-directory: code
        shell: bash
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          path: code

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/go.mod

      - name: Build rules.dat file
        run: go run ./

      - name: Publish timestamped release
        run: |
          # One release per build, never deleting the old ones, so every day's
          # rules.dat stays downloadable. The tag is a bare yyyymmddHHMMSS number;
          # --latest still moves the releases/latest alias so clients pinned to it
          # keep resolving the newest dataset.
          tag=$(date +%Y%m%d%H%M%S)
          gh release create "$tag" rules.dat \
            --latest \
            --title "rules.dat $tag" \
            --notes "Auto-generated rules.dat from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bad-proxy-go
          path: code/rules.dat
          overwrite: true