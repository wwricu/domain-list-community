name: Build rules.dat
on:
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions: write-all
    defaults:
      run:
        working-directory: code
        shell: bash
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          path: code

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/go.mod

      - name: Build rules.dat file
        run: go run ./

      - name: Update latest release
        run: |
          # Delete previous 'latest' release and tag if exists
          gh release delete latest --yes --cleanup-tag || true
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          # Create new 'latest' release
          gh release create latest rules.dat --latest --title "Latest Build ($(date +%Y-%m-%d))" --notes "Auto-generated rules.dat from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bad-proxy-go
          path: code/rules.dat
          overwrite: true