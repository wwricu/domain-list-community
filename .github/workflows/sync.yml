name: Sync upstream (data-only)

on:
  schedule:
    - cron: '0 0 * * *' # every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync upstream data/ only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/v2fly/domain-list-community.git
          git fetch --quiet upstream
          # Replace only data/ with upstream's version; leave gob tooling untouched.
          git rm -r --quiet data
          git checkout upstream/master -- data
          git add -A data
          if git diff --staged --quiet; then
            echo "No upstream data changes."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: pull upstream v2fly domain lists (data/ only)"
            git push origin master
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi
      # No release built here: the push above triggers Build rules.dat (build.yml),
      # which owns publishing the timestamped release. Keeping release creation in
      # one workflow avoids two jobs racing to write the same day's dataset.
