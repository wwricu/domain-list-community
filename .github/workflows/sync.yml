name: Sync upstream (data-only)

on:
  schedule:
    - cron: '0 0 * * *' # every day
  workflow_dispatch:

permissions:
  contents: write
  # For the gh workflow run below: GitHub will not start a run for the push the
  # sync makes with GITHUB_TOKEN, so build.yml is asked by name instead.
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Sync upstream data/ only
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/v2fly/domain-list-community.git
          git fetch --quiet upstream
          # Replace only data/ with upstream's version; leave gob tooling untouched.
          git rm -r --quiet data
          git checkout upstream/master -- data
          git add -A data
          if git diff --staged --quiet; then
            echo "No upstream data changes."
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "sync: pull upstream v2fly domain lists (data/ only)"
            git push origin master
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

      # The build stays in build.yml: one place publishes a release, so two jobs
      # never race to write the same day's dataset. What it cannot rely on is the
      # push above, because that is made with GITHUB_TOKEN and GitHub starts no
      # workflow run for a push made with that token - which is why the dataset
      # stopped at the last commit pushed by hand. Asking for the build by name is
      # the one thing that survives the rule.
      - name: Ask for the build this data needs
        if: steps.sync.outputs.synced == 'true'
        run: gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
